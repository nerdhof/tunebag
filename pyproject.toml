[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixy"
version = "0.1.0"
description = "Distributed music cache for DJ mixes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "qrcode>=8.0",
  "yt-dlp>=2024.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
mixy = "mixy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mixy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
